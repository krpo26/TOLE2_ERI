workflows:
  android-apk:
    name: TOLE2_ERI APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Crear proyecto Android
        script: npx cap add android && npx cap sync android
      - name: Compilar APK
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - rglord87@gmail.com
